// Applied after Capacitor's generated configuration; secrets are runner-only environment variables.
def releaseCode = System.getenv('PLAYER_VERSION_CODE') ?: '1'
def releaseName = System.getenv('PLAYER_VERSION_NAME') ?: '1.0.0'
if (!(releaseCode ==~ /[1-9][0-9]{0,8}/)) throw new GradleException('Invalid PLAYER_VERSION_CODE')
if (!(releaseName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('Invalid PLAYER_VERSION_NAME')
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def signingKeys = ['PLAYER_KEYSTORE_PATH', 'PLAYER_KEYSTORE_PASSWORD', 'PLAYER_KEY_ALIAS', 'PLAYER_KEY_PASSWORD']
def signingReady = signingKeys.every { System.getenv(it) } && file(System.getenv('PLAYER_KEYSTORE_PATH')).exists()
def updatePublication = System.getenv('PLAYER_PUBLISH_RELEASE') == 'true'
if (updatePublication && !signingReady) logger.warn('Signing secrets skipped: published TV update uses the runner debug key and will not install over existing TVs')
if (releaseRequested && !signingReady) throw new GradleException('Release requires all four upload-signing environment variables')
android {
    compileSdk = 36
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionCode releaseCode.toInteger()
        versionName releaseName
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    if (signingReady) {
        signingConfigs {
            playUpload {
                storeFile file(System.getenv('PLAYER_KEYSTORE_PATH'))
                storePassword System.getenv('PLAYER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLAYER_KEY_ALIAS')
                keyPassword System.getenv('PLAYER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '-debug'
            if (signingReady) signingConfig signingConfigs.playUpload
        }
        release {
            debuggable false
            if (signingReady) signingConfig signingConfigs.playUpload
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError true; checkReleaseBuilds true }
}