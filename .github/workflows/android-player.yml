name: Build Android TV player
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Published HTTPS application origin (without /player)"
        required: true
        type: string
      build_mode:
        description: "Debug APK only, or signed APK and Play AAB (requires GitHub upload-key secrets)"
        required: true
        type: choice
        default: debug
        options: [debug, play-release]
      publish_release:
        description: "Publish the APK as a GitHub Release so TVs can be updated from the dashboard"
        required: true
        default: false
        type: boolean
      version_code:
        description: "Leave empty to increment automatically from the latest GitHub Release"
        required: false
        default: ""
        type: string
      version_name:
        description: "Leave empty to derive automatically (1.0.<version_code>)"
        required: false
        default: ""
        type: string
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compute player version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          CODE="$INPUT_CODE"
          if [ -z "$CODE" ]; then
            LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(test("^player-[0-9]+$")) | ltrimstr("player-") | tonumber] | max // 1')
            CODE=$((LAST + 1))
          fi
          NAME="$INPUT_NAME"
          if [ -z "$NAME" ]; then NAME="1.0.$CODE"; fi
          echo "PLAYER_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "PLAYER_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Version $NAME (code $CODE)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK (Capacitor 8)
        uses: android-actions/setup-android@v3
        with:
          # Override the action's obsolete default: tools platform-tools.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - run: bun install --frozen-lockfile
      - name: Test player and Android configuration
        run: bunx vitest run src/test/android-workflow.test.ts src/test/android-autostart.test.ts src/test/android-play.test.ts src/test/player-vault.test.ts src/test/player-storage-error.test.tsx src/test/tv-navigation.test.ts src/test/player-restart.test.tsx src/test/player-position.test.tsx src/test/tv-player.test.ts src/test/video-wall.test.ts src/test/player-protocol.test.ts src/test/device-api.test.ts src/test/webpage.test.ts src/test/webpage-stage.test.tsx src/test/webpage-native.test.tsx src/test/player-audio.test.tsx
      - name: Test artifact audit
        run: python3 scripts/test-android-artifacts.py
      - name: Test native auto-start policy
        run: node scripts/test-android-autostart.mjs
      - name: Test pairing-safe APK update policy
        run: |
          node scripts/test-android-update.mjs
          bunx vitest run src/test/player-pairing-recovery.test.tsx
      - name: Validate server address
        env:
          PLAYER_ORIGIN: ${{ inputs.api_origin }}
        run: node -e 'const u=new URL(process.env.PLAYER_ORIGIN);if(u.protocol!=="https:"||u.pathname!=="/"||u.search||u.hash||u.username||u.password)throw Error("HTTPS origin required")'
      - name: Validate version
        run: node -e 'if(!/^[1-9][0-9]{0,8}$/.test(process.env.PLAYER_VERSION_CODE)||!/^\d+\.\d+\.\d+$/.test(process.env.PLAYER_VERSION_NAME))throw Error("Invalid version")'
      - name: Prepare private upload key
        if: inputs.build_mode == 'play-release' || inputs.publish_release
        env:
          PLAYER_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAYER_UPLOAD_KEYSTORE_BASE64 }}
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['PLAYER_UPLOAD_KEYSTORE_BASE64', 'PLAYER_KEYSTORE_PASSWORD', 'PLAYER_KEY_ALIAS', 'PLAYER_KEY_PASSWORD']
          if not all(os.environ.get(key) for key in required):
              raise SystemExit('TV updates require all four persistent signing secrets using the original APK key. Do not uninstall paired TVs.')
          path = Path(os.environ['RUNNER_TEMP']) / 'screenflow-upload.jks'
          path.write_bytes(base64.b64decode(os.environ['PLAYER_UPLOAD_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - run: bun run player:build
        env:
          VITE_PLAYER_API_ORIGIN: ${{ inputs.api_origin }}
          VITE_PLAYER_VERSION_NAME: ${{ env.PLAYER_VERSION_NAME }}
          VITE_PLAYER_BUILD: ${{ github.sha }}
      - run: bun run android:prepare
      - run: bun run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
        env:
          PLAYER_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PLAYER_KEYSTORE_PATH: ${{ runner.temp }}/screenflow-upload.jks
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
      - name: Audit debug APK and manifest
        run: |
          python3 scripts/check-android-artifacts.py android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/tv-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/tv-badging.txt"
          grep -q 'leanback-launchable-activity:' "$RUNNER_TEMP/tv-badging.txt"
          python3 scripts/check-android-manifest.py android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: screenflow-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compile signed production APK and AAB
        if: inputs.build_mode == 'play-release'
        working-directory: android
        env:
          PLAYER_KEYSTORE_PATH: ${{ runner.temp }}/screenflow-upload.jks
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease bundleRelease
      - name: Audit signed release
        if: inputs.build_mode == 'play-release'
        run: |
          python3 scripts/check-android-artifacts.py android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          python3 scripts/check-android-manifest.py android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        if: inputs.build_mode == 'play-release'
        with:
          name: screenflow-tv-play-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
      - name: Remove private upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/screenflow-upload.jks"
      - name: Publish GitHub Release for remote TV updates
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ "${{ inputs.build_mode }}" = "play-release" ]; then APK=android/app/build/outputs/apk/release/app-release.apk; fi
          cp "$APK" "$RUNNER_TEMP/screenflow-tv.apk"
          (cd "$RUNNER_TEMP" && sha256sum screenflow-tv.apk | cut -d' ' -f1 > screenflow-tv.apk.sha256)
          gh release create "player-${PLAYER_VERSION_CODE}" "$RUNNER_TEMP/screenflow-tv.apk" "$RUNNER_TEMP/screenflow-tv.apk.sha256" --title "${PLAYER_VERSION_NAME}" --notes "ScreenFlow TV ${PLAYER_VERSION_NAME} (code ${PLAYER_VERSION_CODE})" --latest
